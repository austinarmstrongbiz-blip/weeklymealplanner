# Free plan: no persistent disk. Render's free filesystem is ephemeral, so
# /data is recreated and reseeded from this repo (scripts/server.py
# _init_data_dir) on every cold start. Anything worth keeping must be
# committed to git, not written through the API alone.
services:
  - type: web
    name: above-kitch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 scripts/server.py
    envVars:
      - key: DATA_DIR
        value: /data
      # In-app Claude chat. Set the values in the Render dashboard, not here.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional but recommended: the app is public, so a passcode stops
      # strangers from running up the API bill.
      - key: CHAT_PASSCODE
        sync: false
